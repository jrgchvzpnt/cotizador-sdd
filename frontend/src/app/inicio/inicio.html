@if (mostrarBienvenida()) {
  <mat-card>
    <mat-card-content class="flex flex-col items-start gap-3 py-2">
      <mat-icon class="!h-10 !w-10 !text-4xl text-blue-600">waving_hand</mat-icon>
      <h2 class="text-xl font-medium">Bienvenido a Cotizador</h2>
      <p class="text-gray-600">
        Antes de crear tu primera cotización, configura tu perfil (nombre, correo,
        teléfono y logo) para que salga con tu marca. También puedes crear tu
        cotización primero si prefieres.
      </p>
      <div class="flex flex-wrap gap-2">
        <a mat-flat-button color="primary" routerLink="/perfil">Configurar mi perfil</a>
        <a mat-stroked-button routerLink="/cotizaciones/nueva">Crear mi primera cotización</a>
      </div>
    </mat-card-content>
  </mat-card>
}
