spring.application.name=cotizador

# Base de datos H2 embebida en archivo (sin servidor de base de datos aparte, Principio I).
# El archivo se crea junto al JAR en tiempo de ejecucion, dentro de ./data/
spring.datasource.url=jdbc:h2:file:./data/cotizador;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
# Usuario y password configurables por variables de entorno (Principio V: sin secretos en el codigo).
spring.datasource.username=${COTIZADOR_DB_USER:sa}
spring.datasource.password=${COTIZADOR_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}
